services:
  - type: web
    name: chor-police-bot
    env: node
    plan: free
    buildCommand: cd bot && npm install
    startCommand: node bot/index.js
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: "@chorpolicegamebot"
      - key: TELEGRAM_WEBAPP_URL
        sync: false
      - key: TELEGRAM_APP_SHORT_NAME
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PORT
        value: 3000
